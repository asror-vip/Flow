<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLOW — Minimalist Project Management Workspace</title>
    <meta
      name="description"
      content="A portfolio-quality, dark minimalist project management workspace for freelancers, designers, and developers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="bg-flow-bg text-flow-text-primary antialiased selection:bg-flow-accent/20 selection:text-flow-accent">
    <!-- Application Shell Container -->
    <div id="app" class="flex min-h-screen">
      <!-- Mobile Sidebar Backdrop -->
      <div
        id="mobile-sidebar-backdrop"
        class="fixed inset-0 z-40 bg-black/80 backdrop-blur-xs hidden md:hidden transition-opacity"
      ></div>

      <!-- Application Sidebar (Desktop Fixed + Mobile Off-canvas Drawer) -->
      <aside
        id="app-sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 bg-flow-sidebar border-r border-flow-border flex flex-col justify-between transition-transform duration-200 transform -translate-x-full md:translate-x-0"
      >
        <!-- Top: Brand & Main Navigation -->
        <div class="p-4 flex flex-col flex-1 overflow-y-auto">
          <!-- Brand Wordmark & Symbol -->
          <div class="flex items-center justify-between px-2 py-3 mb-5 border-b border-flow-border/50">
            <a href="#overview" class="flex items-center gap-2.5 group">
              <!-- Geometric Minimalist Brand Mark -->
              <div class="w-8 h-8 rounded-lg bg-flow-surface-elevated border border-flow-border flex items-center justify-center text-flow-accent group-hover:border-flow-accent/60 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                  <line x1="4" y1="22" x2="4" y2="15" />
                </svg>
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-bold tracking-wider text-flow-text-primary">FLOW</span>
                <span class="text-[10px] text-flow-text-muted tracking-tight">WORKSPACE</span>
              </div>
            </a>

            <!-- Close Mobile Menu Button -->
            <button
              id="mobile-menu-close"
              class="md:hidden text-flow-text-muted hover:text-flow-text-primary p-1 rounded-md"
              aria-label="Close navigation"
            >
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Main Navigation Links -->
          <div class="space-y-1 mb-6">
            <div class="px-2 pb-1.5 text-[11px] font-semibold text-flow-text-muted uppercase tracking-wider">
              Navigation
            </div>

            <a
              href="#overview"
              data-nav="overview"
              class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-flow-text-secondary hover:text-flow-text-primary hover:bg-flow-surface-hover/70 transition-colors"
            >
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>Overview</span>
            </a>

            <a
              href="#projects"
              data-nav="projects"
              class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-flow-text-secondary hover:text-flow-text-primary hover:bg-flow-surface-hover/70 transition-colors"
            >
              <i data-lucide="folder" class="w-4 h-4"></i>
              <span>Projects</span>
            </a>

            <a
              href="#kanban"
              data-nav="kanban"
              class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-flow-text-secondary hover:text-flow-text-primary hover:bg-flow-surface-hover/70 transition-colors"
            >
              <i data-lucide="columns-3" class="w-4 h-4"></i>
              <span>Kanban Board</span>
            </a>

            <a
              href="#tasks"
              data-nav="tasks"
              class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-flow-text-secondary hover:text-flow-text-primary hover:bg-flow-surface-hover/70 transition-colors"
            >
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>My Tasks</span>
            </a>

            <a
              href="#calendar"
              data-nav="calendar"
              class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-flow-text-secondary hover:text-flow-text-primary hover:bg-flow-surface-hover/70 transition-colors"
            >
              <i data-lucide="calendar" class="w-4 h-4"></i>
              <span>Calendar</span>
            </a>
          </div>

          <!-- Active Workspace Projects Section -->
          <div class="flex-1 space-y-1">
            <div class="flex items-center justify-between px-2 pb-1.5">
              <span class="text-[11px] font-semibold text-flow-text-muted uppercase tracking-wider">
                Projects
              </span>
              <button
                id="sidebar-btn-add-project"
                class="text-flow-text-muted hover:text-flow-accent p-0.5 rounded transition-colors"
                title="Create project"
              >
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              </button>
            </div>

            <!-- Dynamic Project Mini-list in Sidebar -->
            <div id="sidebar-projects-list" class="space-y-0.5"></div>
          </div>
        </div>

        <!-- Sidebar Bottom: Settings & User Profile -->
        <div class="p-3 border-t border-flow-border bg-flow-surface-primary/30 space-y-1">
          <a
            href="#settings"
            data-nav="settings"
            class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-flow-text-secondary hover:text-flow-text-primary hover:bg-flow-surface-hover/70 transition-colors"
          >
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>Settings</span>
          </a>

          <!-- User Profile Display -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-flow-surface-elevated/40 border border-flow-border/50">
            <div class="w-7 h-7 rounded-full bg-flow-surface-hover border border-flow-accent/40 flex items-center justify-center text-xs font-semibold text-flow-accent flex-shrink-0" id="sidebar-user-avatar">
              AV
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-xs font-semibold text-flow-text-primary truncate" id="sidebar-user-name">
                Alex Vance
              </div>
              <div class="text-[10px] text-flow-text-muted truncate" id="sidebar-user-role">
                Designer & Dev
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Workspace Area -->
      <div class="flex-1 flex flex-col md:pl-64 min-w-0 min-h-screen">
        <!-- Top Bar -->
        <header class="sticky top-0 z-30 h-16 bg-flow-bg/90 backdrop-blur-md border-b border-flow-border px-4 sm:px-8 flex items-center justify-between gap-4">
          <!-- Left: Mobile Menu Toggle & Breadcrumb Title -->
          <div class="flex items-center gap-3 min-w-0">
            <button
              id="mobile-menu-toggle"
              class="md:hidden text-flow-text-secondary hover:text-flow-text-primary p-2 -ml-2 rounded-lg hover:bg-flow-surface-elevated transition-colors"
              aria-label="Open mobile navigation"
            >
              <i data-lucide="menu" class="w-5 h-5"></i>
            </button>

            <div class="flex items-center gap-2 min-w-0">
              <span class="text-sm font-semibold text-flow-text-primary truncate" id="topbar-page-title">
                Overview
              </span>
            </div>
          </div>

          <!-- Right: Search, Notifications, + New Task, Profile -->
          <div class="flex items-center gap-2 sm:gap-3">
            <!-- Global Search Trigger Button -->
            <button
              id="topbar-btn-search"
              class="flex items-center gap-2 bg-flow-surface-primary hover:bg-flow-surface-hover border border-flow-border text-flow-text-muted hover:text-flow-text-primary px-3 py-1.5 rounded-lg text-xs transition-colors"
              title="Search workspace (Ctrl+K)"
            >
              <i data-lucide="search" class="w-3.5 h-3.5 text-flow-accent"></i>
              <span class="hidden sm:inline">Search...</span>
              <kbd class="hidden sm:inline-block text-[10px] font-mono px-1 rounded bg-flow-surface-elevated border border-flow-border text-flow-text-muted">⌘K</kbd>
            </button>

            <!-- Notification Bell with Dropdown Menu -->
            <div class="relative">
              <button
                id="btn-notifications"
                class="relative p-2 text-flow-text-secondary hover:text-flow-text-primary hover:bg-flow-surface-hover rounded-lg transition-colors border border-transparent hover:border-flow-border"
                aria-label="View notifications"
              >
                <i data-lucide="bell" class="w-4 h-4"></i>
                <span
                  id="notifications-badge"
                  class="hidden absolute top-1 right-1 w-4 h-4 rounded-full bg-[#EF4444] text-[10px] font-bold text-white flex items-center justify-center leading-none"
                ></span>
              </button>

              <!-- Notifications Dropdown Panel -->
              <div
                id="dropdown-notifications"
                class="hidden absolute right-0 mt-2 w-80 sm:w-96 rounded-xl bg-flow-surface-elevated border border-flow-border shadow-modal z-50 overflow-hidden"
              ></div>
            </div>

            <!-- Quick "New Task" Action -->
            <button
              id="topbar-btn-new-task"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-black bg-flow-accent hover:bg-flow-accent-hover rounded-lg transition-colors shadow-subtle"
            >
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">New Task</span>
            </button>
          </div>
        </header>

        <!-- Main Content View Container -->
        <main id="view-container" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto"></main>

        <!-- Minimalist Footer -->
        <footer class="border-t border-flow-border/40 py-6 px-4 sm:px-8 text-center text-xs text-flow-text-muted flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <span class="font-bold tracking-wider text-flow-text-secondary">FLOW</span>
            <span>•</span>
            <span>Focused, calm, and reliable workspace</span>
          </div>
          <div class="flex items-center gap-4 text-[11px]">
            <span>Local Browser Storage Active</span>
            <span>•</span>
            <a href="#settings" class="hover:text-flow-accent transition-colors">Workspace Settings</a>
          </div>
        </footer>
      </div>
    </div>

    <!-- Modals and Overlays Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
